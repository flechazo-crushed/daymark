import java.time.Instant
import java.time.LocalDate
import java.time.OffsetDateTime
import java.time.ZoneId
import java.time.format.DateTimeFormatter

plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.github.QWEA0:liquidglass:v2.0.10'
}

def defaultCountdownStart = '2026-10-01T00:00:00+08:00'
def countdownStartInput = providers.gradleProperty('countdownStart').orElse(defaultCountdownStart).get()
def signingStoreFile = providers.gradleProperty('signingStoreFile').orNull
def signingStoreType = providers.gradleProperty('signingStoreType').orNull
def signingStorePassword = providers.gradleProperty('signingStorePassword').orNull
def signingKeyAlias = providers.gradleProperty('signingKeyAlias').orNull
def signingKeyPassword = providers.gradleProperty('signingKeyPassword').orNull
def countdownStart
def countdownEpochSeconds

try {
    def parsed = OffsetDateTime.parse(countdownStartInput)
    countdownStart = parsed.toString()
    countdownEpochSeconds = parsed.toEpochSecond()
} catch (Exception ignored) {
    try {
        def parsed = Instant.parse(countdownStartInput)
        countdownStart = parsed.toString()
        countdownEpochSeconds = parsed.epochSecond
    } catch (Exception ignoredAgain) {
        try {
            LocalDate parsedDate
            try {
                parsedDate = LocalDate.parse(countdownStartInput)
            } catch (Exception ignoredDashedDate) {
                parsedDate = LocalDate.parse(countdownStartInput, DateTimeFormatter.BASIC_ISO_DATE)
            }
            def parsed = parsedDate
                    .atStartOfDay(ZoneId.of('Asia/Shanghai'))
                    .toOffsetDateTime()
            countdownStart = parsed.toString()
            countdownEpochSeconds = parsed.toEpochSecond()
        } catch (Exception ignoredDateOnly) {
            throw new GradleException("countdownStart must be yyyyMMdd, yyyy-MM-dd, or ISO-8601, for example 20260321")
        }
    }
}

android {
    namespace 'com.example.daymark'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.daymark'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.0.14'

        buildConfigField 'long', 'COUNTDOWN_START_EPOCH_SECONDS', "${countdownEpochSeconds}L"
        buildConfigField 'String', 'COUNTDOWN_START_ISO', '"' + countdownStart.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingStoreFile != null) {
                storeFile file(signingStoreFile)
                if (signingStoreType != null) {
                    storeType signingStoreType
                }
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingStoreFile != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
