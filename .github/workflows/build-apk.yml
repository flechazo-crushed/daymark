name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      start_time:
        description: "固定起始时间（ISO-8601，例如 2026-12-31T23:59:59+08:00）"
        required: true
        default: "2026-10-01T00:00:00+08:00"
        type: string
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COUNTDOWN_START: ${{ inputs.start_time || '2026-10-01T00:00:00+08:00' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease -PcountdownStart="$COUNTDOWN_START"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daymark-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
