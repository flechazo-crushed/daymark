name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COUNTDOWN_START: "20260321"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_password="$(openssl rand -hex 32)"
          signing_store_file="$RUNNER_TEMP/daymark-release.jks"
          keytool -genkeypair -v \
            -keystore "$signing_store_file" \
            -storetype JKS \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias daymark-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Daymark, OU=Build, O=Daymark, L=Shanghai, ST=Shanghai, C=CN"
          echo "SIGNING_PASSWORD=$signing_password" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_FILE=$signing_store_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PcountdownStart="$COUNTDOWN_START"
          -PsigningStoreFile="$SIGNING_STORE_FILE"
          -PsigningStorePassword="$SIGNING_PASSWORD"
          -PsigningKeyAlias=daymark-release
          -PsigningKeyPassword="$SIGNING_PASSWORD"

      - name: Prepare signed release APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/daymark-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: daymark-release
          path: app/build/outputs/apk/release/daymark-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/daymark-release.apk \
            --title "Daymark $GITHUB_REF_NAME" \
            --notes "Signed Android release. The countdown date is fixed at 20260321."
