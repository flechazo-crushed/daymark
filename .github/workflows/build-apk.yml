name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "固定开始日期/时间（2026-12-31 或 ISO-8601）"
        required: true
        default: "2026-10-01T00:00:00+08:00"
        type: string
      home_image:
        description: "主页图片 URL，或仓库内图片路径（可留空使用默认图片）"
        required: false
        default: "mmexport1789272863975.jpg"
        type: string
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COUNTDOWN_START: ${{ inputs.start_date || '2026-10-01T00:00:00+08:00' }}
      HOME_IMAGE: ${{ inputs.home_image || 'mmexport1789272863975.jpg' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Embed homepage image
        if: ${{ env.HOME_IMAGE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          default_image="app/src/main/res/drawable/home_image.xml"
          temp_image="$(mktemp)"
          if [[ "$HOME_IMAGE" =~ ^https://github\.com/[^/]+/[^/]+/blob/[^/]+/.+ ]]; then
            github_path="${HOME_IMAGE#https://github.com/}"
            source_owner="${github_path%%/*}"
            github_path="${github_path#*/}"
            source_repo="${github_path%%/*}"
            github_path="${github_path#*/}"
            github_path="${github_path#blob/}"
            source_ref="${github_path%%/*}"
            source_path="${github_path#*/}"
            source_path="${source_path%%\?*}"
            api_url="https://api.github.com/repos/${source_owner}/${source_repo}/contents/${source_path}?ref=${source_ref}"
            curl --fail --location --retry 3 --max-time 60 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github.raw+json" \
              "$api_url" --output "$temp_image"
          elif [[ "$HOME_IMAGE" == https://* || "$HOME_IMAGE" == http://* ]]; then
            curl --fail --location --retry 3 --max-time 60 "$HOME_IMAGE" --output "$temp_image"
          else
            test -f "$HOME_IMAGE"
            cp -- "$HOME_IMAGE" "$temp_image"
          fi

          mime_type="$(file --brief --mime-type "$temp_image")"
          case "$mime_type" in
            image/png) extension="png" ;;
            image/jpeg) extension="jpg" ;;
            image/webp) extension="webp" ;;
            *) echo "home_image must be a PNG, JPEG, or WEBP image (detected: $mime_type)"; exit 1 ;;
          esac

          rm -f "$default_image" \
            app/src/main/res/drawable/home_image.png \
            app/src/main/res/drawable/home_image.jpg \
            app/src/main/res/drawable/home_image.webp
          mv "$temp_image" "app/src/main/res/drawable/home_image.$extension"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_password="$(openssl rand -hex 32)"
          signing_store_file="$RUNNER_TEMP/daymark-release.jks"
          keytool -genkeypair -v \
            -keystore "$signing_store_file" \
            -storetype JKS \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias daymark-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Daymark, OU=Build, O=Daymark, L=Shanghai, ST=Shanghai, C=CN"
          echo "SIGNING_PASSWORD=$signing_password" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_FILE=$signing_store_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PcountdownStart="$COUNTDOWN_START"
          -PsigningStoreFile="$SIGNING_STORE_FILE"
          -PsigningStorePassword="$SIGNING_PASSWORD"
          -PsigningKeyAlias=daymark-release
          -PsigningKeyPassword="$SIGNING_PASSWORD"

      - name: Prepare signed release APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/daymark-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: daymark-release
          path: app/build/outputs/apk/release/daymark-release.apk
          if-no-files-found: error
