name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COUNTDOWN_START: "20260321"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Prepare fixed release signing key
        shell: bash
        env:
          DAYMARK_KEYSTORE_BASE64: ${{ secrets.DAYMARK_KEYSTORE_BASE64 }}
          DAYMARK_KEYSTORE_PASSWORD: ${{ secrets.DAYMARK_KEYSTORE_PASSWORD }}
          DAYMARK_KEY_ALIAS: ${{ secrets.DAYMARK_KEY_ALIAS }}
          DAYMARK_KEY_PASSWORD: ${{ secrets.DAYMARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in DAYMARK_KEYSTORE_BASE64 DAYMARK_KEYSTORE_PASSWORD DAYMARK_KEY_ALIAS DAYMARK_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required repository secret: $required" >&2
              exit 1
            fi
          done
          signing_store_file="$RUNNER_TEMP/daymark-release.p12"
          printf '%s' "$DAYMARK_KEYSTORE_BASE64" | base64 --decode > "$signing_store_file"
          echo "SIGNING_STORE_FILE=$signing_store_file" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$DAYMARK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$DAYMARK_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$DAYMARK_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PcountdownStart="$COUNTDOWN_START"
          -PsigningStoreFile="$SIGNING_STORE_FILE"
          -PsigningStoreType="$SIGNING_STORE_TYPE"
          -PsigningStorePassword="$SIGNING_STORE_PASSWORD"
          -PsigningKeyAlias="$SIGNING_KEY_ALIAS"
          -PsigningKeyPassword="$SIGNING_KEY_PASSWORD"

      - name: Prepare signed release APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/daymark-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: daymark-release
          path: app/build/outputs/apk/release/daymark-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/daymark-release.apk \
            --title "Daymark $GITHUB_REF_NAME" \
            --notes "Signed Android release using the repository's fixed release key. The countdown date is fixed at 20260321."
